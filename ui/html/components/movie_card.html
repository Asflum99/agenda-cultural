{{ define "movie_card" }}
  <article class="movie-card carousel-item">
    <div class="card-image-container">
      {{ if .PosterURL }}
        <img
          src="{{ .PosterURL }}"
          alt="{{ .Title }}"
          loading="lazy"
          class="movie-poster"
        />
      {{ else }}
        <div class="poster-placeholder">
          <svg class="poster-placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="7" x2="7" y2="7"></line>
            <line x1="2" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="7" x2="22" y2="7"></line>
            <line x1="17" y1="17" x2="22" y2="17"></line>
          </svg>
          <span class="poster-placeholder-text">Póster no disponible</span>
          <span class="poster-placeholder-sub">Imagen no encontrada en TMDB</span>
        </div>
      {{ end }}
    </div>

    <div class="card-content vstack">
      <h2 class="movie-title">{{ .Title }}</h2>

      <div class="data-list">
        <div class="data-item">
          <svg class="data-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <div>
            <span class="data-label">Fecha</span>
            <span class="data-value capitalize">{{ formatDate .Date }}</span>
          </div>
        </div>

        <div class="data-item">
          <svg class="data-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <div>
            <span class="data-label">Lugar</span>
            <span class="data-value break-word">{{ .Location }}</span>
          </div>
        </div>
      </div>

      <div class="card-footer">
        <a
          href="{{ if .SourceURL }}
            {{ .SourceURL }}
          {{ else }}
            #
          {{ end }}"
          target="_blank"
          rel="noopener noreferrer"
          class="official-link"
        >
          Ver sitio oficial
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>
    </div>
  </article>
{{ end }}
